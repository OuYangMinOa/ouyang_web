name: CI/CD

# PR → 只跑測試（main 的保護規則要求 test 通過才能 merge）
# push 到 dev  → 部署 staging（https://test.ouyang.app）
# push 到 main → 部署 prod（https://ouyang.app）
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          # PR 只讀 dev/main 存好的快取，不另存一份（每份約 400 MB，Actions 快取整個 repo 只有 10 GB）
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Backend tests
        working-directory: backend
        run: cargo test --locked
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend lint & build
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # 平常 2–5 分鐘；下載 layer 卡住時直接失敗，重跑就好，不要乾等
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      env_name: ${{ steps.meta.outputs.env_name }}
    steps:
      - uses: actions/checkout@v5
      - id: meta
        # GHCR 的名稱必須全小寫
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [ "$GITHUB_REF_NAME" = main ]; then env_name=prod other=staging; else env_name=staging other=prod; fi
          echo "env_name=$env_name" >> "$GITHUB_OUTPUT"
          echo "image=$repo:$env_name-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "latest=$repo:$env_name-latest" >> "$GITHUB_OUTPUT"
          echo "cache=$repo:buildcache-$env_name" >> "$GITHUB_OUTPUT"
          echo "cache_other=$repo:buildcache-$other" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: GIT_SHA=${{ github.sha }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.latest }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          # Docker 層快取放在 GHCR 的 buildcache-<env>，不佔 Actions 快取。
          # 先讀自己環境的，沒有再借另一個環境的（dev→main 的程式碼通常一樣）。
          cache-from: |
            type=registry,ref=${{ steps.meta.outputs.cache }}
            type=registry,ref=${{ steps.meta.outputs.cache_other }}
          cache-to: type=registry,ref=${{ steps.meta.outputs.cache }},mode=max,image-manifest=true,oci-mediatypes=true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      ENV_NAME: ${{ needs.build.outputs.env_name }}
    steps:
      - uses: actions/checkout@v5
      - name: Upload deploy files
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: deploy
          target: /home/ubuntu/ouyang_web/${{ env.ENV_NAME }}
          strip_components: 1
      - name: Deploy
        uses: appleboy/ssh-action@v1
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ needs.build.outputs.image }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GHCR_USER,GHCR_TOKEN,IMAGE,ENV_NAME
          script: bash "/home/ubuntu/ouyang_web/$ENV_NAME/deploy.sh" "$ENV_NAME" "$IMAGE"

  # 部署成功後清 GHCR：只動這個環境的 tag，留最近 10 版當回滾用，<env>-latest 永遠保留。
  # buildcache-<env> 不在 delete-tags 的範圍內；它每次被覆蓋後留下的舊版沒有 tag，由 delete-untagged 清掉
  # （attestation 這類掛在有 tag 映像底下的子項目，這個 action 會自動略過）。
  cleanup:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          delete-tags: ${{ needs.build.outputs.env_name }}-*
          exclude-tags: ${{ needs.build.outputs.env_name }}-latest
          keep-n-tagged: 10
          delete-untagged: true
