name: CI/CD

# PR → 只跑測試（main 的保護規則要求 test 通過才能 merge）
# push 到 dev  → 部署 staging（https://test.ouyang.app）
# push 到 main → 部署 prod（https://ouyang.app）
#
# dev → main 不重測、不重 build：要進 main 的程式碼跟 dev 某次部署的一模一樣時（tree 相同），
# 那次 push dev 已經測過、建好 staging-<commit> 映像，PR 略過測試，push main 直接把那個映像加上 prod 的 tag。
# 找不到可沿用的（main 有 dev 沒有的修改、dev 還沒 build 完、那版已被 cleanup 清掉）就照常測試和 build。
# 手動觸發（workflow_dispatch）一律重測、重 build。
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      tested_image: ${{ steps.reuse.outputs.image }}
    steps:
      - uses: actions/checkout@v5
        with:
          # 要看得到 merge commit 的兩個 parent
          fetch-depth: 2
      - id: reuse
        name: Find tested staging image
        if: github.base_ref == 'main' || (github.event_name == 'push' && github.ref_name == 'main')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null || true
          tree=$(git rev-parse 'HEAD^{tree}')
          # HEAD：dev fast-forward 推上 main；HEAD^2：merge commit 合進來的 dev（PR 的 merge ref 也是這個形狀）
          for rev in HEAD HEAD^2; do
            sha=$(git rev-parse --verify --quiet "$rev^{commit}") || continue
            [ "$(git rev-parse "$sha^{tree}")" = "$tree" ] || continue
            # staging 映像只在 test 通過後才會 build，存在就代表這份程式碼測過了
            if docker buildx imagetools inspect "$repo:staging-$sha" >/dev/null 2>&1; then
              echo "::notice::程式碼和 staging-$sha 相同，沿用那個映像，略過測試和 build"
              echo "image=$repo:staging-$sha" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "沒有可沿用的 staging 映像，照常測試和 build"
      - id: rust
        name: Rust version from Dockerfile
        if: steps.reuse.outputs.image == ''
        run: |
          version=$(sed -n 's/^FROM rust:\([0-9.]*\)-.*/\1/p' Dockerfile)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        if: steps.reuse.outputs.image == ''
        with:
          toolchain: ${{ steps.rust.outputs.version }}
      - uses: Swatinem/rust-cache@v2
        if: steps.reuse.outputs.image == ''
        with:
          workspaces: backend
          # 固定 key，不帶 job 名稱：下面的 warm-cache 存的快取這裡才讀得到
          shared-key: backend-test
          # PR 只讀 dev/main 存好的快取，不另存一份（每份約 400 MB，Actions 快取整個 repo 只有 10 GB）
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Backend tests
        if: steps.reuse.outputs.image == ''
        working-directory: backend
        run: cargo test --locked
      - uses: actions/setup-node@v5
        if: steps.reuse.outputs.image == ''
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend lint & build
        if: steps.reuse.outputs.image == ''
        working-directory: frontend
        env:
          # 不下載 onnxruntime-node 的 CUDA 檔案（前端用不到），原因見 Dockerfile
          ONNXRUNTIME_NODE_INSTALL: skip
        run: |
          npm ci
          npm run lint
          npm run build

  # push main 沿用 staging 映像時 test 不會編譯，main 的 Rust 快取就一直停在舊的。
  # dev→main 的 PR 只讀得到 main（目標分支）的快取、讀不到 dev 的，Cargo.lock 一變就要重編上百個套件（多 2 分鐘）。
  # 這裡只編譯不跑測試，把快取存回 main；跟 build、deploy 並行，不會拖慢 prod 部署。
  warm-cache:
    needs: test
    if: github.event_name == 'push' && github.ref_name == 'main' && needs.test.outputs.tested_image != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: rust
        name: Rust version from Dockerfile
        run: |
          version=$(sed -n 's/^FROM rust:\([0-9.]*\)-.*/\1/p' Dockerfile)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.version }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          shared-key: backend-test
      - name: Build tests
        working-directory: backend
        run: cargo test --locked --no-run

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # 平常 2–5 分鐘；下載 layer 卡住時直接失敗，重跑就好，不要乾等
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      env_name: ${{ steps.meta.outputs.env_name }}
    env:
      # test 找到的 staging 映像；空的就自己 build
      TESTED_IMAGE: ${{ needs.test.outputs.tested_image }}
    steps:
      - id: meta
        # GHCR 的名稱必須全小寫
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [ "$GITHUB_REF_NAME" = main ]; then env_name=prod other=staging; else env_name=staging other=prod; fi
          echo "env_name=$env_name" >> "$GITHUB_OUTPUT"
          echo "image=$repo:$env_name-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "latest=$repo:$env_name-latest" >> "$GITHUB_OUTPUT"
          echo "cache=$repo:buildcache-$env_name" >> "$GITHUB_OUTPUT"
          echo "cache_other=$repo:buildcache-$other" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reuse staging image
        if: env.TESTED_IMAGE != ''
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          LATEST: ${{ steps.meta.outputs.latest }}
        # 在 GHCR 上替同一個 manifest 多加 tag，不下載、不上傳 layer。
        # digest 必須不變：cleanup 刪 staging 舊版時，遇到還掛著 prod tag 的映像只會拿掉 staging 的 tag；
        # 如果 prod 變成另一個 index、底下的子 manifest 跟 staging 共用，刪 staging 會連帶把 prod 的子 manifest 刪掉。
        run: |
          docker buildx imagetools create --tag "$IMAGE" --tag "$LATEST" "$TESTED_IMAGE"
          cmp <(docker buildx imagetools inspect --raw "$TESTED_IMAGE") <(docker buildx imagetools inspect --raw "$IMAGE")
      - uses: actions/checkout@v5
        if: env.TESTED_IMAGE == ''
      - uses: docker/setup-buildx-action@v3
        if: env.TESTED_IMAGE == ''
      - uses: docker/build-push-action@v6
        if: env.TESTED_IMAGE == ''
        with:
          context: .
          platforms: linux/amd64
          build-args: GIT_SHA=${{ github.sha }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.latest }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          # Docker 層快取放在 GHCR 的 buildcache-<env>，不佔 Actions 快取。
          # 先讀自己環境的，沒有再借另一個環境的。
          cache-from: |
            type=registry,ref=${{ steps.meta.outputs.cache }}
            type=registry,ref=${{ steps.meta.outputs.cache_other }}
          cache-to: type=registry,ref=${{ steps.meta.outputs.cache }},mode=max,image-manifest=true,oci-mediatypes=true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      ENV_NAME: ${{ needs.build.outputs.env_name }}
    steps:
      - uses: actions/checkout@v5
      - name: Upload deploy files
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: deploy
          target: /home/ubuntu/ouyang_web/${{ env.ENV_NAME }}
          strip_components: 1
      - name: Deploy
        uses: appleboy/ssh-action@v1
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ needs.build.outputs.image }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GHCR_USER,GHCR_TOKEN,IMAGE,ENV_NAME
          script: bash "/home/ubuntu/ouyang_web/$ENV_NAME/deploy.sh" "$ENV_NAME" "$IMAGE"

  # 部署成功後清 GHCR：只動這個環境的 tag，留最近 10 版當回滾用，<env>-latest 永遠保留。
  # buildcache-<env> 不在 delete-tags 的範圍內；它每次被覆蓋後留下的舊版沒有 tag，由 delete-untagged 清掉
  # （attestation 這類掛在有 tag 映像底下的子項目，這個 action 會自動略過）。
  cleanup:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          delete-tags: ${{ needs.build.outputs.env_name }}-*
          exclude-tags: ${{ needs.build.outputs.env_name }}-latest
          keep-n-tagged: 10
          delete-untagged: true
