name: Production

# 打 tag（例如 git tag v0.1.0 && git push origin v0.1.0）才部署正式機。
# 不重新 build：直接把 staging 驗證過、同一個 commit 的 image 加上版本 tag。
on:
  push:
    tags: ['v*']

concurrency:
  group: prod
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - id: meta
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "source=$repo:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "image=$repo:${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "latest=$repo:latest" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Retag staging image
        # 這個 commit 還沒經過 staging（找不到 sha- image）時會在這裡失敗
        run: >
          docker buildx imagetools create
          -t ${{ steps.meta.outputs.image }}
          -t ${{ steps.meta.outputs.latest }}
          ${{ steps.meta.outputs.source }}

  deploy:
    needs: promote
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5
      - name: Upload deploy files
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: deploy/*
          target: /home/ubuntu/ouyang_web/prod
          strip_components: 1
      - name: Deploy
        uses: appleboy/ssh-action@v1
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ needs.promote.outputs.image }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GHCR_USER,GHCR_TOKEN,IMAGE
          script: bash /home/ubuntu/ouyang_web/prod/deploy.sh prod "$IMAGE"
