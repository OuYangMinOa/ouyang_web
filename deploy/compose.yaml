# staging 和 prod 共用這份，差異寫在 <env>.env；IMAGE 由 deploy.sh 帶入。
# 用不同的 project name（-p ouyang-web-<env>）啟動，volume 也會跟著分開。
services:
  app:
    image: ${IMAGE:?IMAGE is required}
    restart: unless-stopped
    ports:
      - "${HOST_PORT:?HOST_PORT is required}:8080"
    environment:
      APP_ENV: ${APP_ENV:?APP_ENV is required}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - data:/data
    mem_limit: ${MEM_LIMIT:-256m}

volumes:
  data:
