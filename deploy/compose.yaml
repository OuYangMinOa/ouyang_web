# staging 和 prod 共用這份，差異寫在 <env>.env；deploy.sh 會組出同目錄的 .env（含 IMAGE、專案名稱）。
# 不對外綁 port：流量一律由 Traefik 經 ouyang-web 網路送進來，docker rollout 才能同時跑新舊兩個容器。
services:
  app:
    image: ${IMAGE:?IMAGE is required}
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:?APP_ENV is required}
      RUST_LOG: ${RUST_LOG:-info}
      # prod 和 staging 都走 HTTPS，<env>.env 設了 COOKIE_SECURE=true，登入 cookie 只會走 HTTPS
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      MUSIC_DIR: /music
      # 地震速報經過主機上的 relay（systemd 的 wb-relay，:8080），和歐陽小俠共用 wolfx 的連線
      EEW_RELAY_URL: ${EEW_RELAY_URL:-ws://host.docker.internal:8080/relay}
      # 中央氣象署開放資料的授權碼，放在伺服器上的 secrets.env（不進 git）；沒設定就不抓氣象署的資料
      CWA_API_KEY: ${CWA_API_KEY:-}
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - data:/data
      # 音樂 APP 的檔案由 Discord bot（Xiao-Xia）放進這個資料夾，容器只讀不寫
      - ${MUSIC_HOST_DIR:?MUSIC_HOST_DIR is required}:/music:ro
    networks:
      - ouyang-web
    mem_limit: ${MEM_LIMIT:-256m}
    # 收到 SIGTERM 後會先 drain 5 秒（DRAIN_SECS）再關閉，要留足時間避免被 SIGKILL
    stop_grace_period: 20s
    labels:
      - traefik.enable=true
      # 兩個環境都走 Traefik 的 :443，依網址分流（APP_HOST 寫在 <env>.env）。
      # entrypoint 沿用舊名稱 prod：Traefik 是共用的，改名的話，還沒換版的那個環境的 router 會找不到 entrypoint 而斷線
      - traefik.http.routers.${APP_ENV}.entrypoints=prod
      - traefik.http.routers.${APP_ENV}.rule=Host(`${APP_HOST:?APP_HOST is required}`)
      - traefik.http.routers.${APP_ENV}.middlewares=${APP_ENV}-retry
      - traefik.http.services.${APP_ENV}.loadbalancer.server.port=8080
      # Traefik 每秒主動檢查；舊容器 drain 時 health 回 503，會在停止前就被移出負載平衡
      - traefik.http.services.${APP_ENV}.loadbalancer.healthcheck.path=/api/health
      - traefik.http.services.${APP_ENV}.loadbalancer.healthcheck.interval=1s
      - traefik.http.services.${APP_ENV}.loadbalancer.healthcheck.timeout=1s
      # 換版瞬間連到正在關閉的舊容器時，改送到另一個容器重試
      - traefik.http.middlewares.${APP_ENV}-retry.retry.attempts=3
      - traefik.http.middlewares.${APP_ENV}-retry.retry.initialinterval=100ms

volumes:
  data:

networks:
  ouyang-web:
    external: true
