# staging 與 prod 共用的反向代理，以固定專案名稱 ouyang-web-traefik 啟動（見 deploy.sh）。
# 注意：任一環境部署時都會套用自己這份設定，所以修改這裡會同時影響 staging 和 prod。
services:
  traefik:
    image: traefik:v3.7
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=ouyang-web
      - --entrypoints.staging.address=:8102
      # prod 走 HTTPS：TLS 設在 entrypoint 上，app 的 router 不用另外標 tls
      - --entrypoints.prod.address=:443
      - --entrypoints.prod.http.tls.certresolver=letsencrypt
      - --entrypoints.prod.http.tls.domains[0].main=music.ouyangminwei.com
      # :80 只做兩件事：Let's Encrypt 的驗證（優先權最高，不會被轉址），其他一律轉到 https
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=prod
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      # 憑證由 Traefik 自動申請、到期前自動續約，存在 letsencrypt volume
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --ping=true
      - --log.level=INFO
    ports:
      - "80:80"
      - "8102:8102"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    networks:
      - ouyang-web
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  letsencrypt:

networks:
  ouyang-web:
    external: true
